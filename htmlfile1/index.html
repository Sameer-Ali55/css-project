<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html1</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Hello!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis, tempora quo. Dolores reiciendis dolore quasi animi magnam a unde sapiente?</p>

    <h1>Login</h1>

    <form>
      <div>
        <label for="name">Full Name:</label>
        <input type="name" id="name" placeholder="Enter your name" />
      </div>
      <br />
      <div>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+92355 010010" />
      </div>
      <br />

      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" />
      </div>
      <br />

      <div>
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password">
      </div>
      <br />

      <div>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
      </div>
      <div>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
      </div>
      <br />

      <input type="checkbox" name="put" value="undergraduate" id="undergraduate">
      <label for="undergraduate">Undergraduate</label>

      <input type="checkbox" name="put" value="fsc" id="fsc">
      <label for="fsc">FSC<label>

      <input type="checkbox" name="put" value="matric" id="matric">
      <label for="matric">Matric<label>


      <br />
      <textarea name="message" rows="5" cols="30" placeholder="Write message"></textarea>
      <br />

      <select name="Package">
        <option value="pr">Premium</option>
        <option value="nr">Normal</option>
        <option value="gu">Guest</option>
      </select>
      <br />
      <button type="reset">Reset</button>

      <br />
      <button type="submit">Login</button>

    </form>
  </body>

 
</html>
